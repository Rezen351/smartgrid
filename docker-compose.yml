

services:
  nginx:
    image: nginx:alpine
    container_name: smartgrid-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - smartgrid-network

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: smartgrid-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./volumes/mosquitto:/mosquitto/data
    restart: unless-stopped
    networks:
      - smartgrid-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    user: "0"
    command:
      - "tunnel"
      - "run"
      - "--token"
      - "${CLOUDFLARED_TUNNEL_TOKEN}"
      - "smartfarm-tunnel"
    environment:
      CLOUDFLARED_TUNNEL_TOKEN: "${CLOUDFLARED_TUNNEL_TOKEN}"
    depends_on:
      - nginx
    networks:
      - smartgrid-network

networks:
  smartgrid-network:
    driver: bridge

