<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#004b87">
  <title>Sign in · SmartGrid</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="/static/img/favicon.svg?v=20260810-5">
  <link rel="stylesheet" href="/static/css/research.css?v=20260810-12">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-card {
      width: min(420px, 100%);
      border: 1px solid var(--slate-300);
      border-radius: 12px;
      background: #fffefa;
      box-shadow: var(--shadow-float);
      padding: 28px;
    }
    .login-card h1 {
      margin: 0 0 4px;
      font-size: 22px;
      color: var(--institution-blue-deep);
    }
    .login-card p {
      margin: 0 0 18px;
      color: var(--slate-600);
      font-size: 13px;
    }
    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 14px;
    }
    .field label {
      font-size: 12px;
      font-weight: 700;
      color: var(--slate-700);
      letter-spacing: .02em;
    }
    .field input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--slate-300);
      border-radius: 6px;
      background: #f8f8f4;
      color: var(--slate-800);
      font-family: var(--font);
      font-size: 14px;
    }
    .field input:focus {
      border-color: var(--institution-blue);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0,118,185,.12);
      outline: none;
    }
    .btn {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      background: var(--institution-blue);
      color: #fff;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: var(--institution-blue-deep); }
    .btn:disabled { opacity: .7; cursor: not-allowed; }
    .login-error {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fff1f2;
      color: #9f1239;
      font-size: 13px;
      font-weight: 600;
      display: none;
    }
    .login-footer {
      margin-top: 18px;
      text-align: center;
      color: var(--slate-500);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>SmartGrid</h1>
      <p>Sign in to access the dashboard.</p>
      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="identifier">Username or email</label>
          <input id="identifier" name="identifier" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit" id="login-button">Sign in</button>
        <div class="login-error" id="login-error" role="alert" aria-live="polite"></div>
      </form>
      <div class="login-footer">Use the default admin credentials from your environment configuration.</div>
    </div>
  </div>

  <script>
    (function () {
      const form = document.getElementById('login-form');
      const errorBox = document.getElementById('login-error');
      const button = document.getElementById('login-button');

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = 'block';
      }

      function hideError() {
        errorBox.style.display = 'none';
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        hideError();
        button.disabled = true;
        button.textContent = 'Signing in…';

        try {
          const response = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              identifier: document.getElementById('identifier').value.trim(),
              password: document.getElementById('password').value,
            }),
          });

          const data = await response.json();
          if (!response.ok || !data.success) {
            const message = (data && data.error && data.error.message) || 'Invalid credentials';
            showError(message);
            return;
          }

          localStorage.setItem('access_token', data.data.access_token);
          localStorage.setItem('refresh_token', data.data.refresh_token);
          window.location.href = '/dashboard/daily';
        } catch (err) {
          showError('Unable to reach the authentication service.');
        } finally {
          button.disabled = false;
          button.textContent = 'Sign in';
        }
      });
    })();
  </script>
</body>
</html>
