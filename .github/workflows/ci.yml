name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARED_TUNNEL_TOKEN: dummy-token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker services
        run: docker compose build --pull

  go-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [ auth, module, export ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Download dependencies
        working-directory: services/${{ matrix.service }}
        run: go mod download

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: go test -v ./...

      - name: Run go vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...

  python-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: services/dashboard/requirements.txt

      - name: Install dependencies
        working-directory: services/dashboard
        run: pip install --no-cache-dir -r requirements.txt

      - name: Verify Python syntax
        working-directory: services/dashboard
        run: python -m py_compile app.py history.py research.py
